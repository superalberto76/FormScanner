[alembic]
script_location = alembic

# Adds the current directory (backend/) to sys.path so that `from app.models import Base`
# works when running `alembic` from the backend/ directory or from /app inside Docker.
prepend_sys_path = .

# Fallback URL used when DATABASE_URL env var is not set.
# env.py overrides this with the DATABASE_URL env var at runtime.
# The hostname 'db' matches the docker-compose service name.
sqlalchemy.url = postgresql+psycopg://formscanner:change_me_db_password@db:5432/formscanner

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
